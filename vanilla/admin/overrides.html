<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overrides & Adjustments — Admin Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="portal-layout">
    <aside class="portal-sidebar light print-hide" id="admin-sidebar"></aside>

    <div class="portal-main">
      <div class="portal-topbar-mobile light print-hide" id="admin-mobile-topbar"></div>

      <main class="container-wide" style="padding-top: 1.5rem; padding-bottom: 3rem;">
        <div class="cf-fade" id="admin-overrides-content">
          <!-- Loaded dynamically -->
        </div>
      </main>
    </div>
  </div>

  <!-- Confirm Dialog with role="alertdialog" -->
  <div id="override-modal" class="modal-overlay" role="alertdialog" style="display:none;" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="card-title text-base">Confirm Override Action</h3>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-ink" style="margin-bottom:1rem;" id="modal-summary">
          You are about to adjust this facility's parameters. An immutable entry will be recorded in the audit trail.
        </p>

        <div class="form-group">
          <label for="confirm-reason" class="form-label">
            Reason for override (Mandatory audit explanation) <span class="required">*</span>
          </label>
          <textarea id="confirm-reason" class="form-textarea" placeholder="e.g. Merchant shared the customer's payment screenshot." required></textarea>
          <p class="form-hint">A detailed explanation is required before applying overrides.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-apply" disabled>Apply override</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireRole } from '../js/session.js';
    import { setupNav } from '../js/nav.js';
    import { adminApi } from '../js/api.js';
    import { agreements, merchantById } from '../js/seed.js';
    import { formatMoney } from '../js/format.js';
    import { icon } from '../js/icons.js';

    const session = requireRole('admin', '../login.html');
    if (session) {
      setupNav('admin', 'overrides');
      loadOverrides();
    }

    let successNotice = null;

    function loadOverrides() {
      const container = document.getElementById('admin-overrides-content');

      container.innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title text-2xl">Manual Overrides & Interventions</h1>
            <p class="page-subtitle">Adjust balances, extend grace days, or pause settlement routing with audit reason</p>
          </div>
        </div>

        ${successNotice ? `
          <div class="alert-banner success" style="margin-bottom:1.5rem;">
            <div class="alert-banner-body">
              <p class="alert-banner-title">Override applied successfully</p>
              <p class="alert-banner-text">${successNotice}</p>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">✕</button>
          </div>
        ` : ''}

        <div class="card card-content" style="max-width: 680px; margin-bottom: 2rem;">
          <form id="override-form">
            <div class="form-group">
              <label for="agreementId" class="form-label">Select Agreement / Facility <span class="required">*</span></label>
              <select id="agreementId" name="agreementId" class="form-select" required>
                <option value="" disabled selected>-- Choose an agreement --</option>
                ${agreements.map(a => {
                  const m = merchantById(a.merchantId);
                  return `<option value="${a.id}" role="option">${a.id} — ${m.name} (Outstanding: ${formatMoney(a.outstanding)})</option>`;
                }).join('')}
              </select>
            </div>

            <div class="form-group">
              <label for="override-type" class="form-label">Override Action Type</label>
              <select id="override-type" class="form-select">
                <option value="adjust_balance" selected>Balance adjustment (Manual payment credit)</option>
                <option value="extend_period">Extend repayment target period</option>
                <option value="grace_extension">Extend grace period</option>
                <option value="pause_routing">Pause / Resume settlement routing</option>
                <option value="force_close">Force complete agreement</option>
              </select>
            </div>

            <div class="form-group" id="value-group">
              <label for="override-value" class="form-label" id="value-label">
                Adjustment Value <span class="required">*</span>
              </label>
              <input type="number" id="override-value" class="form-input text-base tabular font-bold" placeholder="500">
              <p class="form-hint" id="value-hint">Amount in rupees to credit against outstanding balance.</p>
            </div>

            <button type="button" class="btn btn-primary btn-lg" id="btn-review" disabled>
              Review and apply
            </button>
          </form>
        </div>

        <!-- Recent Overrides Policy Notice -->
        <div class="alert-banner info" style="max-width: 680px;">
          <div class="alert-banner-body">
            <p class="alert-banner-title">Ops Governance Standard</p>
            <p class="alert-banner-text">Every override requires a documented business reason and is permanently recorded in the immutable audit log with IP, actor and timestamp.</p>
          </div>
        </div>
      `;

      const agreementSelect = document.getElementById('agreementId');
      const typeSelect = document.getElementById('override-type');
      const valInput = document.getElementById('override-value');
      const valLabel = document.getElementById('value-label');
      const valHint = document.getElementById('value-hint');
      const reviewBtn = document.getElementById('btn-review');

      const modal = document.getElementById('override-modal');
      const reasonInput = document.getElementById('confirm-reason');
      const confirmBtn = document.getElementById('btn-confirm-apply');

      function validateReview() {
        const hasAgreement = Boolean(agreementSelect.value);
        const actionType = typeSelect.value;
        const needsValue = actionType !== 'pause_routing' && actionType !== 'force_close';
        const hasValue = valInput.value.trim().length > 0 && Number(valInput.value) > 0;

        if (hasAgreement && (!needsValue || hasValue)) {
          reviewBtn.removeAttribute('disabled');
        } else {
          reviewBtn.setAttribute('disabled', 'true');
        }
      }

      agreementSelect.addEventListener('change', validateReview);
      valInput.addEventListener('input', validateReview);

      typeSelect.addEventListener('change', () => {
        const t = typeSelect.value;
        if (t === 'adjust_balance') {
          valLabel.textContent = 'Adjustment amount (₹)';
          valHint.textContent = 'Amount to reduce outstanding balance by.';
          valInput.placeholder = '500';
          document.getElementById('value-group').style.display = 'block';
        } else if (t === 'extend_period' || t === 'grace_extension') {
          valLabel.textContent = 'Days to extend';
          valHint.textContent = 'Number of additional days.';
          valInput.placeholder = '7';
          document.getElementById('value-group').style.display = 'block';
        } else {
          document.getElementById('value-group').style.display = 'none';
        }
        validateReview();
      });

      // Open Modal
      reviewBtn.addEventListener('click', () => {
        const aId = agreementSelect.value;
        const action = typeSelect.options[typeSelect.selectedIndex].text;
        const val = valInput.value ? `Value: ${valInput.value}` : '';

        document.getElementById('modal-summary').textContent = `Applying "${action}" to agreement ${aId}. ${val}`;
        reasonInput.value = '';
        confirmBtn.setAttribute('disabled', 'true');
        modal.style.display = 'flex';
        reasonInput.focus();
      });

      // Reason validation inside modal
      reasonInput.addEventListener('input', () => {
        if (reasonInput.value.trim().length > 5) {
          confirmBtn.removeAttribute('disabled');
        } else {
          confirmBtn.setAttribute('disabled', 'true');
        }
      });

      const closeModal = () => {
        modal.style.display = 'none';
      };

      document.getElementById('btn-close-modal').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

      // Confirm Apply
      confirmBtn.addEventListener('click', () => {
        const aId = agreementSelect.value;
        const type = typeSelect.value;
        const value = valInput.value;
        const reason = reasonInput.value.trim();

        adminApi.applyOverride({
          agreementId: aId,
          type,
          value,
          reason,
        });

        closeModal();
        successNotice = `Override applied for ${aId}. Action logged in audit trail.`;
        loadOverrides();
      });
    }
  </script>
</body>
</html>
