<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agreement Document — Lender Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .agreement-doc {
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-card);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-card);
    }
    .clause { margin-bottom: 1.25rem; }
    .clause-num { font-weight: 700; color: var(--color-navy); font-size: 13px; }
    .clause-text { font-size: 13px; color: var(--color-ink); line-height: 1.6; margin-top: 0.2rem; }
  </style>
</head>
<body>

  <div class="portal-layout">
    <aside class="portal-sidebar print-hide" id="lender-sidebar"></aside>

    <div class="portal-main">
      <div class="portal-topbar-mobile print-hide" id="lender-mobile-topbar"></div>

      <main class="container-wide" style="padding-top: 1.5rem; padding-bottom: 3rem;">
        <div class="cf-fade" id="lender-agreement-content">
          <!-- Loaded dynamically -->
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { requireRole } from '../js/session.js';
    import { setupNav } from '../js/nav.js';
    import { lenderApi } from '../js/api.js';
    import { formatMoney } from '../js/format.js';
    import { icon, logo } from '../js/icons.js';

    const session = requireRole('lender', '../login.html');
    if (session) {
      setupNav('lender', 'merchants');
      loadAgreement();
    }

    function loadAgreement() {
      const lenderId = session.lenderId || 'l1';
      const urlParams = new URLSearchParams(window.location.search);
      const merchantId = urlParams.get('id') || 'm1';

      let data;
      try {
        data = lenderApi.getAgreementView(lenderId, merchantId);
      } catch (err) {
        document.getElementById('lender-agreement-content').innerHTML = `
          <div class="alert-banner danger">
            <div class="alert-banner-body"><p class="alert-banner-title">${err.message}</p></div>
          </div>
        `;
        return;
      }

      const { agreement, merchant, lender } = data;

      const container = document.getElementById('lender-agreement-content');
      container.innerHTML = `
        <div class="page-header print-hide" style="margin-bottom: 1.25rem;">
          <div class="flex items-center gap-3">
            <a href="merchants.html" class="btn btn-outline btn-sm">
              ${icon('arrowLeft', { size: 14 })} Back
            </a>
            <div>
              <h1 class="page-title text-xl">Lender Copy: Agreement ${agreement.id}</h1>
              <p class="page-subtitle">${merchant.name} · Financed by ${lender.name}</p>
            </div>
          </div>
          <button id="btn-print" class="btn btn-outline btn-sm">
            ${icon('printer', { size: 14 })} Print agreement
          </button>
        </div>

        <div class="agreement-doc print-area">
          <div class="flex justify-between items-center" style="border-bottom:2px solid var(--color-navy); padding-bottom:1rem; margin-bottom:1.5rem;">
            <div>
              ${logo({ height: 26 })}
              <p class="text-xs text-muted" style="margin-top:4px;">Revenue-Share Credit Agreement (Lender Copy)</p>
            </div>
            <div style="text-align:right;">
              <p class="font-bold text-navy text-sm tabular">${agreement.id}</p>
              <p class="text-xs text-muted">Executed: ${agreement.consentDate}</p>
            </div>
          </div>

          <div class="grid-2" style="background:var(--color-canvas); padding:1rem; border-radius:6px; margin-bottom:1.5rem;">
            <div>
              <p class="stat-label">Lender (Credit Provider)</p>
              <p class="font-bold text-navy text-sm" style="margin-top:2px;">${lender.name}</p>
              <p class="text-xs text-muted">Contact: ${lender.contactPerson}</p>
              <p class="text-xs text-muted">Phone: +91 ${lender.phone}</p>
              <p class="text-xs text-muted">${lender.city}</p>
            </div>
            <div>
              <p class="stat-label">Borrower (Shop)</p>
              <p class="font-bold text-navy text-sm" style="margin-top:2px;">${merchant.name}</p>
              <p class="text-xs text-muted">Owner: ${merchant.ownerName}</p>
              <p class="text-xs text-muted">UPI: ${merchant.upiId}</p>
              <p class="text-xs text-muted">${merchant.city}, ${merchant.state}</p>
            </div>
          </div>

          <div class="clause">
            <p class="clause-num">1. Disbursed Facility</p>
            <p class="clause-text">
              The Lender has extended <strong>${formatMoney(agreement.creditAmount)}</strong> to the Borrower with disbursed date ${agreement.disbursedDate}. Current outstanding balance: <strong>${formatMoney(agreement.outstanding)}</strong>.
            </p>
          </div>

          <div class="clause">
            <p class="clause-num">2. Settlement-Split Routing</p>
            <p class="clause-text">
              A pre-agreed share of <strong>${(agreement.rate * 100).toFixed(0)}%</strong> of daily digital collections on QR ${merchant.upiId} routes directly to the lender account until balance completion.
            </p>
          </div>

          <div class="clause">
            <p class="clause-num">3. Penalty Terms & Default Threshold</p>
            <p class="clause-text">${agreement.penaltyTerms}</p>
          </div>
        </div>
      `;

      document.getElementById('btn-print')?.addEventListener('click', () => {
        window.print();
      });
    }
  </script>
</body>
</html>
