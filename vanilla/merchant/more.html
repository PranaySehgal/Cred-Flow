<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More — Merchant Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div id="merchant-header"></div>

  <main class="container-narrow merchant-main-content" style="padding-top: 1.25rem; padding-bottom: 2rem;">
    <div class="cf-fade" id="merchant-more-content">
      <!-- Menu Links -->
    </div>
  </main>

  <script type="module">
    import { requireRole } from '../js/session.js';
    import { setupNav } from '../js/nav.js';
    import { merchantApi } from '../js/api.js';
    import { icon } from '../js/icons.js';

    const session = requireRole('merchant', '../login.html');
    if (session) {
      setupNav('merchant', 'more');
      loadMore();
    }

    function loadMore() {
      const merchantId = session.merchantId || 'm1';
      const merchant = merchantApi.getProfile(merchantId);

      const container = document.getElementById('merchant-more-content');
      container.innerHTML = `
        <div class="card card-content flex items-center gap-3" style="margin-bottom: 1.25rem;">
          <span style="background:var(--color-tint-teal); color:var(--color-teal); width:48px; height:48px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:20px;">🏪</span>
          <div>
            <h2 class="text-base text-navy font-semibold">${merchant.name}</h2>
            <p class="text-xs text-muted">${merchant.ownerName} · +91 ${merchant.phone}</p>
            <p class="text-xs text-teal font-medium" style="margin-top:2px;">UPI: ${merchant.upiId}</p>
          </div>
        </div>

        <div class="card" style="margin-bottom: 1.25rem; overflow:hidden;">
          <a href="credit.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; border-bottom:1px solid var(--color-line); text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('wallet', { size: 18 })} Credit line & agreement terms
            </span>
            <span class="text-muted">&rarr;</span>
          </a>
          <a href="transactions.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; border-bottom:1px solid var(--color-line); text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('history', { size: 18 })} Transaction history
            </span>
            <span class="text-muted">&rarr;</span>
          </a>
          <a href="log-cash-sale.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; border-bottom:1px solid var(--color-line); text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('receipt', { size: 18 })} Log cash sale
            </span>
            <span class="text-muted">&rarr;</span>
          </a>
          <a href="agreement.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; border-bottom:1px solid var(--color-line); text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('fileSignature', { size: 18 })} Loan agreement document
            </span>
            <span class="text-muted">&rarr;</span>
          </a>
          <a href="subscription.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; border-bottom:1px solid var(--color-line); text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('percent', { size: 18 })} CreditFlow subscription plan
            </span>
            <span class="badge ${merchant.subscription.status === 'active' ? 'badge-success' : 'badge-amber'}">
              ${merchant.subscription.plan} (${merchant.subscription.status})
            </span>
          </a>
          <a href="support.html" class="flex justify-between items-center text-sm font-semibold" style="padding:1rem 1.25rem; text-decoration:none;">
            <span class="flex items-center gap-3 text-ink">
              ${icon('headphones', { size: 18 })} Support & dispute resolution
            </span>
            <span class="text-muted">&rarr;</span>
          </a>
        </div>

        <button data-action="sign-out" class="btn btn-outline btn-block text-danger" style="border-color:var(--color-line-strong);">
          ${icon('logout', { size: 15 })} Sign out of Merchant account
        </button>
      `;
    }
  </script>
</body>
</html>
